[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram AI Agent — Partner Chat Risk Monitor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Internal" }]

dependencies = [
    # Bot framework
    "aiogram>=3.7,<4.0",
    # Web server (webhook + Slack callbacks + healthcheck)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Database
    "asyncpg>=0.29",
    "supabase>=2.5",
    # HTTP client
    "httpx>=0.27",
    # Validation / settings
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    # Logging
    "structlog>=24.1",
    # Retries
    "tenacity>=8.4",
    # Language detection
    "langdetect>=1.0.9",
    # Whisper transcription (OpenAI Audio API, direct)
    "openai>=1.35",
    # Slack
    "slack-sdk>=3.27",
    # IANA timezone database — zoneinfo has no system tzdata on Windows (and may
    # lack it in slim containers); needed for per-manager work-hours timezones.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tg-bot = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Third-party libraries that ship no type stubs / py.typed marker. Treat their
# symbols as Any rather than erroring on the import under strict mode.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "langdetect", "langdetect.*"]
ignore_missing_imports = true
