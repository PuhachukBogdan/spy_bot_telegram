# Bot service only. HTTPS/TLS is terminated by a shared "edge" Caddy proxy that
# runs separately on the host (its own compose + Caddyfile, reused across
# projects) and reaches this container by name over the external `edge` docker
# network. This container publishes NO host ports.
#
# Prereqs on the host (one-time):
#   docker network create edge
#   run the edge Caddy with a site block:  <domain> -> reverse_proxy tg-bot:8080
#   (reference copy of that setup is kept out-of-repo under ops/edge/)
#
# Deploy:  docker compose up -d --build

services:
  bot:
    build: .
    image: tg-bot:latest
    container_name: tg-bot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true
